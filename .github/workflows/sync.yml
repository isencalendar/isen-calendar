name: Sync WebAurion

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer Playwright
        run: |
          pip install playwright
          playwright install chromium
      - name: Extraire le planning
        env:
          AURION_USER: ${{ secrets.AURION_USER }}
          AURION_PASS: ${{ secrets.AURION_PASS }}
        run: python sync.py
      - name: Sauvegarder planning.ics
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add planning.ics
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour planning" && git push)
